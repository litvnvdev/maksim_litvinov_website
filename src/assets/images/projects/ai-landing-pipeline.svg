<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AI-assisted landing pipeline</title>
  <desc id="d">Five-stage pipeline: input data, validation, assembly, pre-launch audit and shipping, with an LLM-assisted build phase and a manual review gate before release.</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h1 { font-size: 36px; font-weight: 700; fill: #F4F4F5; letter-spacing: -0.5px; }
      .sub { font-size: 17px; font-weight: 400; fill: #A1A1AA; }
      .step-n { font-size: 12px; font-weight: 700; fill: #F59E0B; letter-spacing: 1.2px; }
      .step-t { font-size: 17px; font-weight: 600; fill: #F4F4F5; }
      .step-d { font-size: 13px; font-weight: 400; fill: #8E8E96; }
      .band { font-size: 13px; font-weight: 600; fill: #F59E0B; letter-spacing: 0.3px; }
      .gate { font-size: 12px; font-weight: 600; fill: #A1A1AA; letter-spacing: 1px; }
      .chip-t { font-size: 14px; font-weight: 600; fill: #E4E4E7; }
      .chip-n { font-size: 14px; font-weight: 700; fill: #F59E0B; }
      .meta { font-size: 12px; font-weight: 500; fill: #6B6B73; letter-spacing: 1px; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5A5A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#1C1C1F"/>

  <!-- header -->
  <text x="60" y="88" class="f h1">AI-assisted landing pipeline</text>
  <text x="60" y="122" class="f sub">Python tooling that builds, validates and ships campaign landing pages</text>

  <!-- llm band -->
  <rect x="60" y="196" width="855" height="34" rx="17" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="86" cy="213" r="3.5" fill="#F59E0B"/>
  <text x="102" y="218" class="f band">LLM-assisted — boilerplate, refactors, copy structure  ·  Cursor · Claude</text>

  <!-- stage boxes -->
  <g>
    <rect x="60" y="262" width="180" height="158" rx="14" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="84" y="295" class="f step-n">01</text>
    <text x="84" y="322" class="f step-t">Input data</text>
    <text x="84" y="350" class="f step-d">Offer, GEO, locale,</text>
    <text x="84" y="370" class="f step-d">tracker parameters</text>
  </g>
  <g>
    <rect x="285" y="262" width="180" height="158" rx="14" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="309" y="295" class="f step-n">02</text>
    <text x="309" y="322" class="f step-t">Validate</text>
    <text x="309" y="350" class="f step-d">Schema checks, dead</text>
    <text x="309" y="370" class="f step-d">links, missing assets</text>
  </g>
  <g>
    <rect x="510" y="262" width="180" height="158" rx="14" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="534" y="295" class="f step-n">03</text>
    <text x="534" y="322" class="f step-t">Assemble</text>
    <text x="534" y="350" class="f step-d">Templated build,</text>
    <text x="534" y="370" class="f step-d">per-locale variants</text>
  </g>
  <g>
    <rect x="735" y="262" width="180" height="158" rx="14" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="759" y="295" class="f step-n">04</text>
    <text x="759" y="322" class="f step-t">Pre-launch audit</text>
    <text x="759" y="350" class="f step-d">Markup, Open Graph,</text>
    <text x="759" y="370" class="f step-d">Schema.org, CWV</text>
  </g>
  <g>
    <rect x="960" y="262" width="180" height="158" rx="14" fill="#252528" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="984" y="295" class="f step-n">05</text>
    <text x="984" y="322" class="f step-t">Ship</text>
    <text x="984" y="350" class="f step-d">Keitaro flows,</text>
    <text x="984" y="370" class="f step-d">postback / S2S</text>
  </g>

  <!-- connectors -->
  <line x1="248" y1="341" x2="277" y2="341" stroke="#5A5A63" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="473" y1="341" x2="502" y2="341" stroke="#5A5A63" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="698" y1="341" x2="727" y2="341" stroke="#5A5A63" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="923" y1="341" x2="952" y2="341" stroke="#5A5A63" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- manual review gate -->
  <line x1="937" y1="196" x2="937" y2="470" stroke="#6B6B73" stroke-width="1.4" stroke-dasharray="5 6"/>
  <text x="937" y="500" class="f gate" text-anchor="middle">MANUAL REVIEW GATE</text>

  <!-- result chips -->
  <g>
    <rect x="60" y="574" width="266" height="58" rx="12" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="86" y="610" class="f chip-n">~3× faster<tspan class="chip-t" dx="8">page preparation</tspan></text>
  </g>
  <g>
    <rect x="346" y="574" width="266" height="58" rx="12" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="372" y="610" class="f chip-n">Automated<tspan class="chip-t" dx="8">pre-launch checks</tspan></text>
  </g>
  <g>
    <rect x="632" y="574" width="266" height="58" rx="12" fill="#252528" stroke="#35353A" stroke-width="1"/>
    <text x="658" y="610" class="f chip-n">CWV<tspan class="chip-t" dx="8">tracked in production</tspan></text>
  </g>

  <text x="60" y="690" class="f meta">PYTHON · JAVASCRIPT · HTML/SCSS · KEITARO</text>
  <text x="1140" y="690" class="f meta" text-anchor="end">NDA · 2026</text>
</svg>
